name: VeroAppSmsGuard CI — Analyze, Test & Multi-Platform Build Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Static Analysis & Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Threat Pipeline Scripts Syntax
        run: |
          python -m py_compile scripts/license_tool.py
          python -m py_compile scripts/prepare_threat_update.py
          python -m py_compile scripts/spam_db_builder.py
          python -m py_compile scripts/turkey_spam_collector.py
          python -m py_compile scripts/weekly_update_pipeline.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Static Analysis (Zero Warnings Gate)
        run: flutter analyze --no-pub

      - name: Run Full Unit, Widget, 10-Locale & Spam Engine Tests
        run: flutter test --no-pub

  build-android:
    name: Android APK Build Verification
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug --no-pub

  build-windows:
    name: Windows Desktop Build Verification
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release Binary
        run: flutter build windows --release --no-pub

  build-ios:
    name: iOS Uncodesigned Build Verification
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign --no-pub
