name: veroapp_sms_guard
description: "VeroApp SMS Guard - 100% Offline On-Device Semantic Intent AI Spam & Security Shield."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/locales/
    - assets/model/
    - assets/branding/
  fonts:
    - family: Book Antiqua
      fonts:
        - asset: assets/fonts/BookAntiqua-Regular.ttf
        - asset: assets/fonts/BookAntiqua-Bold.ttf
          weight: 700
